name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push supersedes the run in flight on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Cache Composer and Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/composer
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-${{ hashFiles('composer.lock', 'bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
