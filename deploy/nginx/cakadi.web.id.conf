# cakadi.web.id — reference config for the manual cutover from lombacv.
#
# This is NOT installed automatically (see scripts/deploy-bluegreen.sh's
# header for why). To cut over by hand, once the first deploy's colour has
# been confirmed healthy (cat /www/catatancakadi/.active_color to see which
# one — the first-ever run picks green/5021, not blue/5020):
#
#   cp cakadi.web.id.conf /etc/nginx/sites-available/cakadi.web.id
#   # edit the proxy_pass port below to match the active colour if it isn't 5020
#   nginx -t && systemctl reload nginx
#   touch /www/catatancakadi/.nginx_managed
#
# ssl_certificate paths are unchanged from lombacv's config — the cert
# already covers this domain and does not need reissuing.
#
# Kept in sync with the actual live file on the server (jayakarta) after the
# 2026-09-27 manual cutover — HTTP/3, the extra X-Forwarded-* headers, long
# proxy timeouts (websockets/long requests), buffering off, and unlimited
# upload size were all added by hand on the server; mirror them here so a
# future reprovision doesn't quietly lose them.
server {
    listen 80;
    listen [::]:80;

    server_name cakadi.web.id www.cakadi.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name cakadi.web.id www.cakadi.web.id;

    ssl_certificate     /etc/lego/certificates/_.cakadi.web.id.crt;
    ssl_certificate_key /etc/lego/certificates/_.cakadi.web.id.key;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # deploy-bluegreen.sh rewrites this port in place on every deploy, once
    # /www/catatancakadi/.nginx_managed exists.
    location / {
        proxy_pass http://127.0.0.1:5020;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 0;
    }
}
