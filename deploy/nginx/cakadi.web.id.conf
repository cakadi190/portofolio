# cakadi.web.id — reference config for the manual cutover from lombacv.
#
# This is NOT installed automatically (see scripts/deploy-bluegreen.sh's
# header for why). To cut over by hand, once the first deploy's colour has
# been confirmed healthy (cat /www/dk_project/cakadi.web.id/.active_color to see which
# one — the first-ever run picks green/5021, not blue/5020):
#
#   cp cakadi.web.id.conf /etc/nginx/sites-available/cakadi.web.id
#   # edit the proxy_pass port below to match the active colour if it isn't 5020
#   nginx -t && systemctl reload nginx
#   touch /www/dk_project/cakadi.web.id/.nginx_managed
#
# ssl_certificate paths are unchanged from lombacv's config — the cert
# already covers this domain and does not need reissuing.
#
# NOTE (2026-10-12): the live server runs aaPanel, not /etc/nginx. Its vhost is
# /www/server/panel/vhost/nginx/www.cakadi.web.id.conf (managed by the panel);
# the 12m upload cap lives in
# /www/server/panel/vhost/nginx/extension/www.cakadi.web.id/upload_limit.conf
# (`client_max_body_size 12m;`), which the panel never overwrites.
#
# Kept in sync with the actual live file on the server (jayakarta) after the
# 2026-09-27 manual cutover — HTTP/3, the extra X-Forwarded-* headers, long
# proxy timeouts (websockets/long requests), buffering off, and the 12m
# upload cap were all added by hand on the server; mirror them here so a
# future reprovision doesn't quietly lose them.
server {
    listen 80;
    listen [::]:80;

    server_name cakadi.web.id www.cakadi.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name cakadi.web.id www.cakadi.web.id;

    ssl_certificate     /etc/lego/certificates/_.cakadi.web.id.crt;
    ssl_certificate_key /etc/lego/certificates/_.cakadi.web.id.key;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # PageSpeed: compression (zstd/br/gzip) is done by Caddy inside the app container
    # (`encode zstd br gzip`), so nginx only needs the cache headers below. The panel's
    # default (`expires 1m` on static files) is what these location blocks replace.

    # Vite output is content-hashed, so it can be cached for a year.
    location /build/assets/ {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # deploy-bluegreen.sh rewrites this port in place on every deploy, once
    # /www/dk_project/cakadi.web.id/.nginx_managed exists.
    location / {
        proxy_pass http://127.0.0.1:5020;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;

        # Matches the app's 10 MB media limit plus multipart overhead; the
        # app only rejects oversize files after receiving them in full.
        client_max_body_size 12m;
    }
}
